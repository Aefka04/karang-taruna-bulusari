backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images"
public_folder: "/assets/images"

locale: "id"

collections:
  - name: "site"
    label: "Pengaturan Situs"
    files:
      - label: "Info Umum"
        name: "info"
        file: "src/_data/site.json"
        fields:
          - { label: "Nama Organisasi Lengkap", name: "nama_organisasi", widget: "string" }
          - { label: "Nama Singkat (mis. Karang Taruna)", name: "nama_singkat", widget: "string" }
          - { label: "Nama Wilayah / Desa", name: "nama_wilayah", widget: "string" }
          - { label: "Tahun untuk Footer", name: "tahun_footer", widget: "string" }

  - name: "kegiatan"
    label: "Kegiatan"
    files:
      - label: "Daftar Kegiatan"
        name: "daftar"
        file: "src/_data/kegiatan.json"
        fields:
          - label: "Kegiatan"
            name: "items"
            widget: "list"
            summary: "{{fields.judul}} — {{fields.tanggal}}"
            fields:
              - { label: "Status", name: "status", widget: "select", options: [{label: "Sudah selesai", value: "selesai"}, {label: "Akan datang", value: "akan_datang"}] }
              - { label: "Tanggal", name: "tanggal", widget: "string", hint: "Contoh: Agustus 2026" }
              - { label: "Judul Kegiatan", name: "judul", widget: "string" }
              - { label: "Deskripsi", name: "deskripsi", widget: "text" }

  - name: "galeri"
    label: "Galeri"
    files:
      - label: "Daftar Foto"
        name: "daftar"
        file: "src/_data/galeri.json"
        fields:
          - label: "Foto"
            name: "items"
            widget: "list"
            summary: "{{fields.judul}}"
            fields:
              - { label: "Gambar", name: "gambar", widget: "image", required: false }
              - { label: "Judul / Nama Kegiatan", name: "judul", widget: "string" }
              - { label: "Tanggal", name: "tanggal", widget: "string" }
              - { label: "Deskripsi Singkat", name: "deskripsi", widget: "string" }

  - name: "kontak"
    label: "Kontak"
    files:
      - label: "Info Kontak"
        name: "info"
        file: "src/_data/kontak.json"
        fields:
          - { label: "Alamat Sekretariat", name: "sekretariat", widget: "string" }
          - { label: "Telepon / WhatsApp", name: "telepon", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram — Nama Akun", name: "instagram_handle", widget: "string" }
          - { label: "Instagram — Tautan", name: "instagram_url", widget: "string" }
          - { label: "Facebook — Nama Halaman", name: "facebook_label", widget: "string" }
          - { label: "Facebook — Tautan", name: "facebook_url", widget: "string" }
          - { label: "Tautan Embed Google Maps", name: "maps_embed_url", widget: "string", hint: "Ambil dari Google Maps > Bagikan > Sematkan peta > salin URL src" }

  - name: "tentang"
    label: "Tentang Kami"
    files:
      - label: "Konten Tentang"
        name: "konten"
        file: "src/_data/tentang.json"
        fields:
          - { label: "Sejarah (bisa lebih dari satu paragraf)", name: "sejarah", widget: "list", field: { label: "Paragraf", name: "paragraf", widget: "text" } }
          - { label: "Visi", name: "visi", widget: "text" }
          - { label: "Misi", name: "misi", widget: "list", field: { label: "Poin Misi", name: "poin", widget: "string" } }
          - { label: "Periode Kepengurusan", name: "periode", widget: "string", hint: "Contoh: 2026–2029" }
          - label: "Struktur Organisasi"
            name: "struktur"
            widget: "list"
            summary: "{{fields.jabatan}} — {{fields.nama}}"
            fields:
              - { label: "Jabatan", name: "jabatan", widget: "string" }
              - { label: "Nama", name: "nama", widget: "string" }

  - name: "absensi_kas"
    label: "Absensi & Kas"
    files:
      - label: "Pengaturan Halaman"
        name: "pengaturan"
        file: "src/_data/absensi.json"
        fields:
          - { label: "Judul Halaman", name: "judul", widget: "string" }
          - { label: "Keterangan Singkat", name: "keterangan", widget: "text" }
          - label: "URL Embed Google Sheets"
            name: "embed_url"
            widget: "string"
            required: false
            hint: "Buka Google Sheets > File > Share > Publish to web > salin tautan embed"
